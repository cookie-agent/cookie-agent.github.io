<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cookie Agent social card</title>
  <!-- The 1200×630 social card, og.png: see README.md for how to render it. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@500&family=JetBrains+Mono:wght@400&display=block">
  <style>
    html, body { margin: 0; }
    body {
      width: 1200px;
      height: 630px;
      display: flex;
      align-items: center;
      gap: 64px;
      padding: 0 88px;
      box-sizing: border-box;
      background: #fbf4e6;
      color: #46301f;
      font-family: "Instrument Sans", sans-serif;
      border-bottom: 14px solid #9c5a10;
    }
    img { width: 300px; height: 300px; flex-shrink: 0; }
    .eyebrow { margin: 0 0 22px; font: 400 24px "JetBrains Mono", monospace; color: #9c5a10; }
    h1 { margin: 0; font: 600 92px/1 "Fraunces", serif; letter-spacing: -0.025em; }
    p.tag { margin: 26px 0 0; font-size: 38px; color: #625240; }
  </style>
</head>
<body>
  <img src="../logo.svg" alt="">
  <div>
    <p class="eyebrow">a subagent-first coding harness</p>
    <h1>Cookie Agent</h1>
    <p class="tag">Simple and mighty coding agent.</p>
  </div>
</body>
</html>
